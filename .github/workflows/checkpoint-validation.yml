name: Checkpoint Validation

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - CHAT_TRANSFER.md
      - CHAT_RULES.md
      - MEMORY_INDEX.md
      - PROJECT_STATE.md
      - HANDOVER.md
      - APP_ANALYSIS_REPORT.md
      - APK_VARIANT_COMPARISON.md
      - APK_CODE_ANALYSIS.md
      - IL2CPP_ANALYSIS_REPORT.md
      - CHATGPT_MOD_BUILD_REPORT.md
      - MOD_CANDIDATES.md
      - ANALYSIS_LOG.md
      - .github/workflows/*.yml
      - tools/*.py
      - tests/*.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-checkpoints:
    name: Validate durable project records
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Compile repository Python scripts
        run: |
          python3 -m py_compile tools/*.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          echo "Python scripts compile and unit tests pass."

      - name: Check required files and transfer prompts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          required = [
              "README.md",
              "CHAT_TRANSFER.md",
              "CHAT_RULES.md",
              "MEMORY_INDEX.md",
              "PROJECT_STATE.md",
              "HANDOVER.md",
              "APP_ANALYSIS_REPORT.md",
              "APK_VARIANT_COMPARISON.md",
              "APK_CODE_ANALYSIS.md",
              "IL2CPP_ANALYSIS_REPORT.md",
              "CHATGPT_MOD_BUILD_REPORT.md",
              "MOD_CANDIDATES.md",
              "ANALYSIS_LOG.md",
          ]
          missing = [name for name in required if not Path(name).is_file()]
          empty = [name for name in required if Path(name).is_file() and not Path(name).read_text(encoding="utf-8").strip()]
          transfer = Path("CHAT_TRANSFER.md").read_text(encoding="utf-8") if Path("CHAT_TRANSFER.md").exists() else ""
          project_state = Path("PROJECT_STATE.md").read_text(encoding="utf-8") if Path("PROJECT_STATE.md").exists() else ""
          handover = Path("HANDOVER.md").read_text(encoding="utf-8") if Path("HANDOVER.md").exists() else ""
          build_report = Path("CHATGPT_MOD_BUILD_REPORT.md").read_text(encoding="utf-8") if Path("CHATGPT_MOD_BUILD_REPORT.md").exists() else ""
          comparison_report = Path("APK_VARIANT_COMPARISON.md").read_text(encoding="utf-8") if Path("APK_VARIANT_COMPARISON.md").exists() else ""

          problems = []
          if missing:
              problems.append("Missing required files: " + ", ".join(missing))
          if empty:
              problems.append("Empty required files: " + ", ".join(empty))
          for marker in ("Diskusi!", "Eksekusi Full!", "Eksekusi Build App!", "CHATGPT Mod", "Canonical repository:"):
              if marker not in transfer:
                  problems.append("CHAT_TRANSFER.md is missing marker: " + marker)
          if not Path(".github/workflows/build-chatgpt-mod.yml").is_file():
              problems.append("Missing .github/workflows/build-chatgpt-mod.yml.")
          for path in ("tools/apk_inputs.py", "tools/compare_apk_variants.py", "tools/analyze_il2cpp.py"):
              if not Path(path).is_file():
                  problems.append("Missing required APK analysis tool: " + path)
          il2cpp_report = Path("IL2CPP_ANALYSIS_REPORT.md").read_text(encoding="utf-8") if Path("IL2CPP_ANALYSIS_REPORT.md").exists() else ""
          if "APKPure Original" not in comparison_report or "Platinmods" not in comparison_report:
              problems.append("APK_VARIANT_COMPARISON.md must identify APKPure as base and Platinmods as reference.")
          if "APKPure" not in il2cpp_report or "IL2CPP" not in il2cpp_report:
              problems.append("IL2CPP_ANALYSIS_REPORT.md must identify the APKPure IL2CPP analysis scope.")
          if not ("CHATGPT Mod" in build_report or "CHATGPT MOD" in build_report) or "**Status:**" not in build_report:
              problems.append("CHATGPT_MOD_BUILD_REPORT.md must record the requested menu label and a status.")
          if "APKPure_Latest" not in build_report or "Platinmods" not in build_report:
              problems.append("CHATGPT_MOD_BUILD_REPORT.md must identify APKPure as the base and Platinmods as reference-only.")
          if "TenzoNkz/YuGiOh-Duel-Link-MOD" not in project_state:
              problems.append("PROJECT_STATE.md is missing the canonical repository identifier.")
          if "NEXT ACTION" not in handover:
              problems.append("HANDOVER.md needs an explicit NEXT ACTION.")

          if problems:
              print("Checkpoint validation failed:")
              for problem in problems:
                  print("- " + problem)
              sys.exit(1)

          print("Checkpoint validation passed. All required records exist and transfer prompts contain the expected markers.")
          PY
