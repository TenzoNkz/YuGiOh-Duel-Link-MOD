name: APK Static Analysis

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      release_tag:
        description: APK or XAPK Release tag to inspect (APKPure is the default)
        required: true
        default: APKPure_Latest
  push:
    branches:
      - main
    paths:
      - .github/workflows/apk-static-analysis.yml
      - tools/analyze_release_apk.py
      - tools/apk_inputs.py

permissions:
  contents: write

concurrency:
  group: apk-static-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect-release-apk:
    name: Download APKPure APK/XAPK and inspect primary APK as data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true

      - name: Analyze release asset
        id: analyze
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || 'APKPure_Latest' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 tools/analyze_release_apk.py \
            --repo "$GITHUB_REPOSITORY" \
            --release-tag "$RELEASE_TAG" \
            --output APP_ANALYSIS_REPORT.md

      - name: Commit generated report
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f APP_ANALYSIS_REPORT.md ]; then
            echo "No report was produced; see the analysis step output."
            exit 0
          fi
          git add APP_ANALYSIS_REPORT.md
          if git diff --cached --quiet; then
            echo "The report has no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh APK static analysis report"
          # Another documentation/checkpoint commit may land while the APK downloads.
          # Rebase the report commit onto the newest branch head before pushing.
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              echo "Could not rebase the report because of a concurrent change."
              exit 1
            fi
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep 2
          done
          echo "Unable to push the generated report after three attempts."
          exit 1

      - name: Preserve analysis failure status
        if: steps.analyze.outcome == 'failure'
        run: |
          echo "APK analysis did not finish cleanly. Inspect the report and this run's logs."
          exit 1
