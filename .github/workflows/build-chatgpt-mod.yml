name: CHATGPT MOD APK Build / QC

on:
  workflow_dispatch:
    inputs:
      base_release_tag:
        description: APKPure Original Release tag (the only allowed build base)
        required: true
        default: APKPure_Latest

permissions:
  contents: write

concurrency:
  group: chatgpt-mod-apk-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-chatgpt-mod:
    name: Build the approved APKPure-based mod APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true

      - name: Validate reverse-engineering and patcher preconditions
        id: preflight
        continue-on-error: true
        env:
          BASE_TAG: ${{ github.event.inputs.base_release_tag || 'APKPure_Latest' }}
        run: |
          set -euo pipefail
          test "$BASE_TAG" = "APKPure_Latest" || {
            echo "Only APKPure_Latest is allowed as the mod base."
            exit 1
          }
          test -f APP_ANALYSIS_REPORT.md
          test -f APK_CODE_ANALYSIS.md
          test -f IL2CPP_ANALYSIS_REPORT.md
          test -f APK_VARIANT_COMPARISON.md
          test -f MOD_CANDIDATES.md
          python3 - <<'PY'
          from pathlib import Path
          import re
          static = Path("APP_ANALYSIS_REPORT.md").read_text(encoding="utf-8")
          code = Path("APK_CODE_ANALYSIS.md").read_text(encoding="utf-8")
          il2cpp = Path("IL2CPP_ANALYSIS_REPORT.md").read_text(encoding="utf-8")
          comparison = Path("APK_VARIANT_COMPARISON.md").read_text(encoding="utf-8")
          candidates = Path("MOD_CANDIDATES.md").read_text(encoding="utf-8")

          blockers = []
          if "**Status:** INVENTORY_COMPLETE\n" not in static:
              blockers.append("APK static inventory is not clean: require INVENTORY_COMPLETE (no CRC/decompression warnings).")
          if "- CRC scan: PASS" not in static:
              blockers.append("Primary APK ZIP CRC/decompression scan must pass.")
          if "**Status:** CODE_ANALYSIS_COMPLETE" not in code:
              blockers.append("APK code analysis is partial or failed.")
          if "outer CRC: FAIL" in code or "outer XAPK CRC=FAIL" in code or "read failed (" in code:
              blockers.append("APK code report contains an unreadable split/CRC failure.")
          if "BUILD BLOCKER:" in comparison or "unreadable/corrupt member: 2" in comparison:
              blockers.append("APKPure-versus-reference comparison reports source corruption.")
          if "Primary APK outer CRC: FAIL" in il2cpp or "ARM64 split outer CRC: FAIL" in il2cpp:
              blockers.append("IL2CPP inputs fail outer XAPK member CRC.")
          if "Build approval: APPROVED_FOR_IMPLEMENTATION" not in candidates:
              blockers.append("No reviewed feature scope is approved in MOD_CANDIDATES.md.")
          if blockers:
              print("Preflight blocked:")
              for blocker in blockers:
                  print("- " + blocker)
              raise SystemExit(1)
          print("Integrity/reverse-engineering reports satisfy build preconditions.")
          PY
          test -f tools/build_chatgpt_mod.py || {
            echo "The APKPure-based patch/build tool has not been implemented."
            exit 1
          }
          echo "Reverse-engineering and patcher preconditions passed."

      - name: Build modified APK from APKPure input
        id: build
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        env:
          BASE_TAG: ${{ github.event.inputs.base_release_tag || 'APKPure_Latest' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 tools/build_chatgpt_mod.py \
            --repo "$GITHUB_REPOSITORY" \
            --base-release-tag "$BASE_TAG" \
            --output dist/CHATGPT-MOD.apk
          test -s dist/CHATGPT-MOD.apk
          unzip -t dist/CHATGPT-MOD.apk
          sha256sum dist/CHATGPT-MOD.apk
          stat -c 'APK size: %s bytes' dist/CHATGPT-MOD.apk

      - name: Upload modified APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: CHATGPT-MOD-${{ github.sha }}
          path: dist/CHATGPT-MOD.apk
          if-no-files-found: error
          retention-days: 14

      - name: Generate durable build report
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$PREFLIGHT_OUTCOME" != "success" ]; then
            status="BLOCKED_REVERSE_ENGINEERING_OR_PATCHER"
            detail="Reverse-engineering, feature approval, or APKPure patcher preconditions are incomplete."
          elif [ "$BUILD_OUTCOME" != "success" ]; then
            status="BUILD_FAILED"
            detail="The APKPure-based build tool ran but did not produce a valid APK. Inspect this workflow's logs."
          else
            status="BUILD_SUCCESS"
            detail="The approved APKPure-based patcher produced an APK and ZIP integrity check passed. Runtime behavior still requires separate testing."
          fi
          {
            echo "# CHATGPT MOD Build Report"
            echo
            echo "**Status:** $status"
            echo "**Checked:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "**Base Release:** APKPure_Latest"
            echo "**Reference only:** Platinmods Release Latest"
            echo "**Source commit:** $SOURCE_SHA"
            echo "**Workflow run:** $RUN_URL"
            echo "**Required in-game menu title:** CHATGPT MOD"
            echo
            echo "## Result"
            echo "$detail"
            echo
            if [ "$BUILD_OUTCOME" = "success" ] && [ -s dist/CHATGPT-MOD.apk ]; then
              echo "- Artifact: CHATGPT-MOD.apk"
              echo "- Size: $(stat -c '%s' dist/CHATGPT-MOD.apk) bytes"
              echo "- SHA-256: $(sha256sum dist/CHATGPT-MOD.apk | cut -d' ' -f1)"
              echo "- Delivery: GitHub Actions artifact, not committed to Git."
            else
              echo "- No modified APK artifact was produced by this run."
            fi
            echo
            echo "## Source and integrity rules"
            echo "- APKPure Original is the sole intended build base."
            echo "- Platinmods is comparison-only."
            echo "- The original Releases are not overwritten."
            echo "- A ZIP integrity check is not proof that the game installs or the mod works."
          } > CHATGPT_MOD_BUILD_REPORT.md

      - name: Commit durable build report
        if: always()
        run: |
          git add CHATGPT_MOD_BUILD_REPORT.md
          if git diff --cached --quiet; then
            echo "The build report has no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh CHATGPT MOD APK build report"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              echo "Unable to rebase the build report onto the latest branch."
              exit 1
            fi
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep 2
          done
          echo "Unable to push the build report after three attempts."
          exit 1

      - name: Mark blocked or failed build
        if: steps.preflight.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          echo "CHATGPT MOD was not built. See CHATGPT_MOD_BUILD_REPORT.md and the preflight/build logs."
          exit 1
