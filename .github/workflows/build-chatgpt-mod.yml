name: CHATGPT Mod Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatgpt-mod-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-chatgpt-mod:
    name: Validate and build CHATGPT Mod APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Validate Android source project and app label
        id: preflight
        continue-on-error: true
        run: |
          set +e
          python3 tools/validate_chatgpt_mod_source.py --project-dir chatgpt-mod --required-label "CHATGPT Mod"
          result=$?
          if [ "$result" -ne 0 ]; then
            echo "Build blocked: source project is missing or the label/project structure is invalid."
          fi
          exit "$result"

      - name: Build Debug APK
        id: build
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          chmod +x chatgpt-mod/gradlew
          chatgpt-mod/gradlew --project-dir chatgpt-mod --no-daemon clean :app:assembleDebug
          mapfile -t apks < <(find chatgpt-mod/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one APK in app/build/outputs/apk/debug; found ${#apks[@]}."
            exit 1
          fi
          mkdir -p dist
          cp "${apks[0]}" dist/CHATGPT-Mod-debug.apk
          echo "apk_path=dist/CHATGPT-Mod-debug.apk" >> "$GITHUB_OUTPUT"
          sha256sum dist/CHATGPT-Mod-debug.apk
          stat -c 'APK size: %s bytes' dist/CHATGPT-Mod-debug.apk

      - name: Upload CHATGPT Mod APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: CHATGPT-Mod-debug-${{ github.sha }}
          path: dist/CHATGPT-Mod-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Generate durable build report
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$PREFLIGHT_OUTCOME" != "success" ]; then
            status="BLOCKED_SOURCE_PROJECT_OR_LABEL"
            detail="No successful source preflight. Inspect the preflight step. Expected project: chatgpt-mod/; required label: CHATGPT Mod."
          elif [ "$BUILD_OUTCOME" != "success" ]; then
            status="BUILD_FAILED"
            detail="The source project passed preflight, but assembleDebug did not complete. Inspect this Actions run."
          else
            status="BUILD_SUCCESS"
            detail="Debug APK built from the checked-in source project and uploaded as a workflow artifact."
          fi
          {
            echo "# CHATGPT Mod Build Report"
            echo
            echo "**Status:** $status"
            echo "**Checked:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "**Source commit:** $SOURCE_SHA"
            echo "**Workflow run:** $RUN_URL"
            echo "**Expected app label:** CHATGPT Mod"
            echo
            echo "## Result"
            echo "$detail"
            echo
            if [ "$BUILD_OUTCOME" = "success" ] && [ -f dist/CHATGPT-Mod-debug.apk ]; then
              echo "- Artifact: CHATGPT-Mod-debug.apk"
              echo "- Size: $(stat -c '%s' dist/CHATGPT-Mod-debug.apk) bytes"
              echo "- SHA-256: $(sha256sum dist/CHATGPT-Mod-debug.apk | cut -d' ' -f1)"
              echo "- Delivery: GitHub Actions artifact; no new Release was created."
            else
              echo "- No APK artifact was produced by this run."
            fi
            echo
            echo "## Scope and integrity"
            echo "- This workflow builds only from the checked-in chatgpt-mod/ source tree."
            echo "- The original Release APK is not modified, overwritten, or republished."
            echo "- UI-only/accessibility/local-only changes and offline simulations are allowed; live online-match outcome modifications are out of scope."
          } > CHATGPT_MOD_BUILD_REPORT.md

      - name: Commit durable build report
        if: always()
        run: |
          git add CHATGPT_MOD_BUILD_REPORT.md
          if git diff --cached --quiet; then
            echo "The build report has no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh CHATGPT Mod build report"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              if [ "${#conflicts[@]}" -eq 1 ] && [ "${conflicts[0]}" = "CHATGPT_MOD_BUILD_REPORT.md" ]; then
                git checkout --theirs -- CHATGPT_MOD_BUILD_REPORT.md
                git add CHATGPT_MOD_BUILD_REPORT.md
                if ! GIT_EDITOR=true git rebase --continue; then
                  git rebase --abort || true
                  echo "Could not continue rebase after resolving build-report-only conflict."
                  exit 1
                fi
              else
                printf 'Unexpected concurrent conflict(s): %s\n' "${conflicts[*]}"
                git rebase --abort || true
                exit 1
              fi
            fi
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep 2
          done
          echo "Unable to push CHATGPT_MOD_BUILD_REPORT.md after three attempts."
          exit 1

      - name: Mark blocked or failed builds
        if: steps.preflight.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          echo "CHATGPT Mod was not built successfully. Check CHATGPT_MOD_BUILD_REPORT.md and this run's logs."
          exit 1
