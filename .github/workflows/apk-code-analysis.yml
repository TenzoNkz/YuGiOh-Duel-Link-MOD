name: APK Code Analysis (APKPure Base)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing public GitHub Release tag to inspect
        required: true
        default: APKPure_Latest
      reference_release_tag:
        description: Platinmods comparison-only Release tag
        required: true
        default: Latest
  push:
    branches:
      - main
    paths:
      - .github/workflows/apk-code-analysis.yml
      - tools/analyze_apk_code.py
      - tools/apk_inputs.py
      - tools/compare_apk_variants.py

permissions:
  contents: write

concurrency:
  group: apk-code-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  decompile-and-scan:
    name: Decode manifest and inspect DEX/native strings
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Run pinned JADX and Apktool analysis
        id: analyze
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || 'APKPure_Latest' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 tools/analyze_apk_code.py \
            --repo "$GITHUB_REPOSITORY" \
            --release-tag "$RELEASE_TAG" \
            --output APK_CODE_ANALYSIS.md

      - name: Compare APKPure base with Platinmods reference
        id: compare
        continue-on-error: true
        env:
          BASE_TAG: ${{ github.event.inputs.release_tag || 'APKPure_Latest' }}
          REFERENCE_TAG: ${{ github.event.inputs.reference_release_tag || 'Latest' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 tools/compare_apk_variants.py \
            --repo "$GITHUB_REPOSITORY" \
            --base-tag "$BASE_TAG" \
            --reference-tag "$REFERENCE_TAG" \
            --output APK_VARIANT_COMPARISON.md

      - name: Commit generated reports
        if: always()
        run: |
          if [ ! -f APK_CODE_ANALYSIS.md ]; then
            echo "No code-analysis report was produced; see the analysis step output."
            exit 0
          fi
          git add APK_CODE_ANALYSIS.md
          if [ -f APK_VARIANT_COMPARISON.md ]; then
            git add APK_VARIANT_COMPARISON.md
          fi
          if git diff --cached --quiet; then
            echo "The code-analysis report has no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh APK code analysis report"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              valid_conflicts=true
              for conflict in "${conflicts[@]}"; do
                case "$conflict" in
                  APK_CODE_ANALYSIS.md|APK_VARIANT_COMPARISON.md)
                    echo "Concurrent report commit detected. Keep this run's generated $conflict."
                    git checkout --theirs -- "$conflict"
                    git add "$conflict"
                    ;;
                  *)
                    valid_conflicts=false
                    ;;
                esac
              done
              if [ "$valid_conflicts" != true ] || [ "${#conflicts[@]}" -eq 0 ]; then
                printf 'Unexpected concurrent conflict(s): %s\n' "${conflicts[*]}"
                git rebase --abort || true
                exit 1
              fi
              if ! GIT_EDITOR=true git rebase --continue; then
                git rebase --abort || true
                echo "Unable to continue rebase after resolving report-only conflicts."
                exit 1
              fi
            fi
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep 2
          done
          echo "Unable to push the generated report after three attempts."
          exit 1

      - name: Preserve analysis failure status
        if: steps.analyze.outcome == 'failure' || steps.compare.outcome == 'failure'
        run: |
          echo "Analysis or APKPure-versus-Platinmods comparison did not finish cleanly. Inspect APK_CODE_ANALYSIS.md, APK_VARIANT_COMPARISON.md, and this run's logs."
          exit 1
